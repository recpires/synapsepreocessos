name: CI — painel interno

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: painel-interno

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24 é a versão em que o projeto é desenvolvido e onde os testes rodam
      # com type stripping nativo — sem isso o runner do Node não lê `.ts`.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: painel-interno/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Bloqueante desde o primeiro dia, ao contrário do lint: são as regras
      # que produzem número errado com aparência de certo — fatia de sócio,
      # parcela de dívida, valor em contrato e recorte por empresa.
      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Valores de fachada: o build não acessa o banco, mas o cliente
          # Supabase exige que as variáveis existam.
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-build

      # Ainda não bloqueia: o código herdado tem 42 erros de lint (a maioria
      # react-hooks/set-state-in-effect). Some conforme os módulos são
      # reescritos nas Fases 02 a 05 — aí este passo vira obrigatório.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Falha se o banco remoto tiver migration que não está no git, ou o
      # contrário. Foi essa divergência que causou o E-03.
      #
      # O token aceita os dois nomes: SUPABASE_ACCESS_TOKEN, se criado à mão,
      # ou o SBP_… que a integração do Supabase com o GitHub gera sozinha.
      - name: Banco e repositório em sincronia
        run: |
          set -o pipefail
          supabase link --project-ref bdfgmgxajzyjtunetnuw
          supabase migration list --linked | tee lista.txt

          # `migration list` sai com código 0 mesmo com divergência — ele só
          # imprime a tabela. Sem esta checagem o job passa sempre, o que é
          # pior do que não existir: dá sensação de cobertura sem cobrir nada.
          #
          # Só linha "remoto sem local" reprova. Migration nova que ainda não
          # foi aplicada é o estado normal de um PR; o perigo é o inverso —
          # mudança no banco sem arquivo no git, que foi o que causou o E-03.
          # Linha órfã tem a coluna Local vazia — literalmente "` `" antes do
          # primeiro pipe. Verificado contra a saída real do CLI.
          orfas=$(grep -E '^\s*`\s+`\s*\|' lista.txt | grep -oE '`[0-9]{14}`' || true)

          if [ -n "$orfas" ]; then
            echo "::error::O banco tem migration que não está no git:"
            echo "$orfas"
            echo "Traga o SQL para supabase/migrations/ antes de seguir."
            exit 1
          fi
          echo "Sem migration órfã no remoto."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SBP_177E9E0B904A73294BF7BAEFEA421F99A9D4584E }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
